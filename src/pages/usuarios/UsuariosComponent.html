<h1>Usuarios</h1>

<button>Crear nuevo usuario</button>

<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Email</th>
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody>
  @for (u of usuarioStore.users(); track u.id) {
    <tr>
      <td>{{ u.nombre}}</td>
      <td>{{ u.email }}</td>
      
      <td>
        <button>Editar</button>
        <button (click)=usuarioStore.eliminarUsuario(u.email)>
          Eliminar
        </button>
      </td>
    </tr>
  }
</tbody>
</table>
