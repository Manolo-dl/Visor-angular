<div class="mx-auto max-w-5xl px-4 py-8">
    <div class="mb-6 flex items-center justify-between">
        <h1 class="text-2xl font-semibold text-gray-900">Usuarios</h1>
        <button
            class="inline-flex items-center rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-indigo-500 transition-colors">
            Crear nuevo usuario
        </button>
    </div>

    <div class="overflow-hidden rounded-lg border border-gray-200 shadow-sm">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Nombre</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Email</th>
                    <th class="px-4 py-3 text-right text-xs font-semibold uppercase tracking-wide text-gray-500">Acciones</th>
                </tr>
            </thead>

            <tbody class="divide-y divide-gray-100 bg-white">
                @for (u of usuarioStore.users(); track u.id) {
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-3 text-sm font-medium text-gray-900">{{ u.nombre}}</td>
                    <td class="px-4 py-3 text-sm text-gray-600">{{ u.email }}</td>

                    <td class="px-4 py-3 text-right text-sm">
                        <button class="mr-2 rounded-md px-2 py-1 font-medium text-indigo-600 hover:bg-indigo-50 transition-colors">Editar</button>
                        <button (click)=usuarioStore.eliminarUsuario(u.email)
                            class="rounded-md px-2 py-1 font-medium text-red-600 hover:bg-red-50 transition-colors">
                            Eliminar
                        </button>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="3" class="px-4 py-8 text-center text-sm text-gray-500">No hay usuarios todavía.</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
